services:
  - type: worker
    name: uzkinobaza-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMINS
        sync: false
      - key: BOT_USERNAME
        value: "@uzkinobaza_bot"
